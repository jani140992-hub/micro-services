[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmart-microservices"
version = "1.0.0"
description = "Enterprise Distributed Microservices Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "jani140992-hub", email = "jani140992-hub@users.noreply.github.com"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "aiokafka>=0.10.0",
    "redis[hiredis]>=5.0.3",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "black>=24.3.0",
    "httpx>=0.27.0",
    "faker>=24.3.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=services --cov=shared --cov-report=term-missing"
testpaths = [
    "tests",
    "services/*/tests"
]
asyncio_mode = "auto"
python_files = "test_*.py"
