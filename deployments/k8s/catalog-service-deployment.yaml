apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: cloudmart
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/part-of: cloudmart
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/part-of: cloudmart
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: catalog-service
          image: ghcr.io/jani140992-hub/micro-services/catalog_service:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: catalog-service-config
            - secretRef:
                name: cloudmart-core-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
