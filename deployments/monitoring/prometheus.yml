global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "api_gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api_gateway:8000"]
  - job_name: "identity_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["identity_service:8001"]
  - job_name: "user_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["user_service:8002"]
  - job_name: "catalog_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["catalog_service:8003"]
  - job_name: "inventory_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inventory_service:8004"]
  - job_name: "order_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["order_service:8005"]
  - job_name: "payment_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["payment_service:8006"]
  - job_name: "shipping_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["shipping_service:8007"]
  - job_name: "notification_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["notification_service:8008"]
  - job_name: "analytics_service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["analytics_service:8009"]
