# Global CloudMart Helm Values
global:
  environment: production
  clusterDomain: cluster.local
  imagePullSecrets: []

ingress:
  enabled: true
  className: nginx
  hostname: api.cloudmart.com
  tls: true
  secretName: cloudmart-api-tls

services:
  api_gateway:
    enabled: true
    replicas: 3
    port: 8000
    image:
      repository: ghcr.io/jani140992-hub/micro-services/api_gateway
      tag: v1.0.0
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1024Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 75
    config:
      custom_helm_key_1: value_1
      custom_helm_key_2: value_2
      custom_helm_key_3: value_3
      custom_helm_key_4: value_4
      custom_helm_key_5: value_5
