name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, master, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check --exit-zero .

      - name: Check Formatting
        run: ruff format --check . || true

  unit-tests:
    name: Microservices Unit Test Suites (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api_gateway
          - identity_service
          - user_service
          - catalog_service
          - inventory_service
          - order_service
          - payment_service
          - shipping_service
          - notification_service
          - analytics_service
          - shared
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy asyncpg redis httpx pyjwt pytest pytest-asyncio pytest-cov

      - name: Run Tests for ${{ matrix.service }}
        run: |
          export PYTHONPATH=$PWD
          if [ "${{ matrix.service }}" = "shared" ]; then
            pytest tests/contracts/ tests/e2e/ -v
          else
            pytest services/${{ matrix.service }}/tests/ -v
          fi
