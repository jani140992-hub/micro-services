version: '3.8'

networks:
  cloudmart-mesh:
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  redis_data:
  postgres_identity_data:
  postgres_user_data:
  postgres_catalog_data:
  postgres_inventory_data:
  postgres_order_data:
  postgres_payment_data:
  postgres_shipping_data:
  postgres_notify_data:
  postgres_analytics_data:
  prometheus_data:
  grafana_data:

services:
  # -------------------------------------------------------------
  # Infrastructure Services (Message Broker, Cache, Observability)
  # -------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cloudmart-zookeeper
    networks:
      - cloudmart-mesh
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cloudmart-kafka
    depends_on:
      - zookeeper
    networks:
      - cloudmart-mesh
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  redis:
    image: redis:7.2-alpine
    container_name: cloudmart-redis
    networks:
      - cloudmart-mesh
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # -------------------------------------------------------------
  # Microservices Databases (Database-Per-Service Pattern)
  # -------------------------------------------------------------
  db-identity:
    image: postgres:16-alpine
    container_name: cloudmart-db-identity
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: identity_db
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data

  db-user:
    image: postgres:16-alpine
    container_name: cloudmart-db-user
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: user_db
    volumes:
      - postgres_user_data:/var/lib/postgresql/data

  db-catalog:
    image: postgres:16-alpine
    container_name: cloudmart-db-catalog
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: catalog_db
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data

  db-inventory:
    image: postgres:16-alpine
    container_name: cloudmart-db-inventory
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data

  db-order:
    image: postgres:16-alpine
    container_name: cloudmart-db-order
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: order_db
    volumes:
      - postgres_order_data:/var/lib/postgresql/data

  db-payment:
    image: postgres:16-alpine
    container_name: cloudmart-db-payment
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: payment_db
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  db-shipping:
    image: postgres:16-alpine
    container_name: cloudmart-db-shipping
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: shipping_db
    volumes:
      - postgres_shipping_data:/var/lib/postgresql/data

  db-notification:
    image: postgres:16-alpine
    container_name: cloudmart-db-notification
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: notification_db
    volumes:
      - postgres_notify_data:/var/lib/postgresql/data

  db-analytics:
    image: postgres:16-alpine
    container_name: cloudmart-db-analytics
    networks:
      - cloudmart-mesh
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: analytics_db
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # Application Microservices
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: cloudmart-api-gateway
    networks:
      - cloudmart-mesh
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: api-gateway
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      IDENTITY_SERVICE_URL: http://identity-service:8001
      USER_SERVICE_URL: http://user-service:8002
      CATALOG_SERVICE_URL: http://catalog-service:8003
      INVENTORY_SERVICE_URL: http://inventory-service:8004
      ORDER_SERVICE_URL: http://order-service:8005
      PAYMENT_SERVICE_URL: http://payment-service:8006
      SHIPPING_SERVICE_URL: http://shipping-service:8007
      NOTIFICATION_SERVICE_URL: http://notification-service:8008
      ANALYTICS_SERVICE_URL: http://analytics-service:8009
    depends_on:
      - redis
      - identity-service
      - catalog-service
      - order-service

  identity-service:
    build:
      context: .
      dockerfile: services/identity_service/Dockerfile
    container_name: cloudmart-identity-service
    networks:
      - cloudmart-mesh
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: identity-service
      PORT: 8001
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-identity:5432/identity_db
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-identity
      - redis
      - kafka

  user-service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    container_name: cloudmart-user-service
    networks:
      - cloudmart-mesh
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: user-service
      PORT: 8002
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-user:5432/user_db
      REDIS_URL: redis://redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-user
      - kafka

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog_service/Dockerfile
    container_name: cloudmart-catalog-service
    networks:
      - cloudmart-mesh
    ports:
      - "8003:8003"
    environment:
      SERVICE_NAME: catalog-service
      PORT: 8003
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-catalog:5432/catalog_db
      REDIS_URL: redis://redis:6379/3
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-catalog
      - redis
      - kafka

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory_service/Dockerfile
    container_name: cloudmart-inventory-service
    networks:
      - cloudmart-mesh
    ports:
      - "8004:8004"
    environment:
      SERVICE_NAME: inventory-service
      PORT: 8004
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-inventory:5432/inventory_db
      REDIS_URL: redis://redis:6379/4
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-inventory
      - redis
      - kafka

  order-service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    container_name: cloudmart-order-service
    networks:
      - cloudmart-mesh
    ports:
      - "8005:8005"
    environment:
      SERVICE_NAME: order-service
      PORT: 8005
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-order:5432/order_db
      REDIS_URL: redis://redis:6379/5
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-order
      - kafka

  payment-service:
    build:
      context: .
      dockerfile: services/payment_service/Dockerfile
    container_name: cloudmart-payment-service
    networks:
      - cloudmart-mesh
    ports:
      - "8006:8006"
    environment:
      SERVICE_NAME: payment-service
      PORT: 8006
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-payment:5432/payment_db
      REDIS_URL: redis://redis:6379/6
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-payment
      - kafka

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping_service/Dockerfile
    container_name: cloudmart-shipping-service
    networks:
      - cloudmart-mesh
    ports:
      - "8007:8007"
    environment:
      SERVICE_NAME: shipping-service
      PORT: 8007
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-shipping:5432/shipping_db
      REDIS_URL: redis://redis:6379/7
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-shipping
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    container_name: cloudmart-notification-service
    networks:
      - cloudmart-mesh
    ports:
      - "8008:8008"
    environment:
      SERVICE_NAME: notification-service
      PORT: 8008
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-notification:5432/notification_db
      REDIS_URL: redis://redis:6379/8
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-notification
      - kafka

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics_service/Dockerfile
    container_name: cloudmart-analytics-service
    networks:
      - cloudmart-mesh
    ports:
      - "8009:8009"
    environment:
      SERVICE_NAME: analytics-service
      PORT: 8009
      DATABASE_URL: postgresql+asyncpg://cloudmart_user:cloudmart_password@db-analytics:5432/analytics_db
      REDIS_URL: redis://redis:6379/9
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - db-analytics
      - kafka

  # -------------------------------------------------------------
  # Observability (Prometheus & Grafana)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cloudmart-prometheus
    networks:
      - cloudmart-mesh
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    container_name: cloudmart-grafana
    networks:
      - cloudmart-mesh
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cloudmart_admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
