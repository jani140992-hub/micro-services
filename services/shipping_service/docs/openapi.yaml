openapi: "3.1.0"
info:
  title: "Shipping & Logistics Service"
  version: "1.0.0"
  description: "Manages carrier integrations (FedEx, UPS, DHL), tracking checkpoints, dispatch routing, and shipping labels."
  contact:
    name: "CloudMart Enterprise Platform Team"
    email: "platform-team@cloudmart.internal"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"
servers:
  - url: "http://localhost:8007/api/v1"
    description: "Local Development Server"
  - url: "https://shipping_service.cloudmart.internal/api/v1"
    description: "Production Kubernetes ClusterIP"
paths:
  /shipments:
    get:
      summary: "Query ShipmentConsignment items with pagination and filters"
      operationId: "list_shipping_service_entities"
      parameters:
        - name: "search"
          in: "query"
          required: false"
          schema:
            type: "string"
            description: "Keyword search term"
        - name: "status"
          in: "query"
          required: false"
          schema:
            type: "string"
            enum: ["DRAFT", "ACTIVE", "SUSPENDED", "ARCHIVED"]
        - name: "category"
          in: "query"
          required: false"
          schema:
            type: "string"
        - name: "page"
          in: "query"
          required: false"
          schema:
            type: "integer"
            default: 1"
            minimum: 1"
        - name: "page_size"
          in: "query"
          required: false"
          schema:
            type: "integer"
            default: 20"
            maximum: 100"
      responses:
        "200":
          description: "Successful paginated list of ShipmentConsignment items"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentConsignmentPageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: "Create a new ShipmentConsignment"
      operationId: "create_shipping_service_entity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShipmentConsignmentRequest"
      responses:
        "201":
          description: "ShipmentConsignment successfully created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentConsignmentDetailResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /shipments/{id}:
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    get:
      summary: "Fetch ShipmentConsignment by UUID"
      operationId: "get_shipping_service_by_id"
      responses:
        "200":
          description: "ShipmentConsignment detail record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentConsignmentDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      summary: "Update ShipmentConsignment attributes"
      operationId: "update_shipping_service_entity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShipmentConsignmentRequest"
      responses:
        "200":
          description: "Successfully updated ShipmentConsignment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentConsignmentDetailResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      summary: "Soft delete ShipmentConsignment"
      operationId: "delete_shipping_service_entity"
      responses:
        "204":
          description: "Successfully deleted"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /shipments/{id}/status:
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    patch:
      summary: "Transition ShipmentConsignment lifecycle state"
      operationId: "change_shipping_service_status"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeShipmentConsignmentStatusRequest"
      responses:
        "200":
          description: "Status successfully updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentConsignmentDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
  /shipments/{id}/sub1:
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    post:
      summary: "Add TrackingCheckpoint child entity"
      operationId: "add_shipping_service_sub1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTrackingCheckpointRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentConsignmentDetailResponse"
  /shipments/{id}/sub2:
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
    post:
      summary: "Add ShippingManifest child entity"
      operationId: "add_shipping_service_sub2"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddShippingManifestRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentConsignmentDetailResponse"
  /shipments/batch:
    post:
      summary: "Execute batch operations on ShipmentConsignment records"
      operationId: "batch_shipping_service_action"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchShipmentConsignmentActionRequest"
      responses:
        "200":
          description: "Batch execution results"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchActionResultResponse"
